[build-system]
requires = ["uv_build>=0.12.21,<0.14"]
build-backend = "uv_build"

[project]
name = "aiorentman"
version = "0.3.2"
description = "Unofficial asynchronous Python library to interact with the Rentman API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Daan Vervacke", email = "daan.vervacke@proton.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
keywords = [
    "rentman",
    "rental",
    "equipment",
    "materials",
    "rfid",
    "serial-numbers",
    "api",
    "asyncio",
    "aiohttp",
    "home-assistant",
]
dependencies = ["aiohttp>=3.14.3"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "aioresponses>=0.7.9",
    "mypy>=1.13",
    "ruff>=0.16",
    "coverage[toml]>=7.15.2",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]

[project.urls]
Homepage = "https://github.com/DaanVervacke/aiorentman"
Repository = "https://github.com/DaanVervacke/aiorentman"
Issues = "https://github.com/DaanVervacke/aiorentman/issues"
Changelog = "https://github.com/DaanVervacke/aiorentman/blob/main/CHANGELOG.md"
Documentation = "https://aiorentman.readthedocs.io/"

[tool.uv]
required-version = ">=0.12.21,<0.14"

[tool.uv.build-backend]
source-include = ["LICENSE"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
    "ANN401",
    "PLR0913",
    "PLR0917",
    "TC001",
    "TC002",
    "TC003",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"scripts/check.py" = ["T201", "S603"]
"scripts/generate.py" = ["T201", "S603"]
"scripts/capture_data.py" = ["T201", "S105"]
"scripts/validate_writes.py" = ["T201", "S101"]
"scripts/_redact.py" = ["T201"]
"docs/conf.py" = ["INP001"]
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "SLF001",
    "PLR2004",
    "RUF059",
    "FBT003",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    "ignore:Unclosed client session:ResourceWarning",
    "ignore:Unclosed connector:ResourceWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]
source_pkgs = ["scripts.generate", "scripts.resources"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = true
fail_under = 98

[tool.mypy]
python_version = "3.14"
strict = true
